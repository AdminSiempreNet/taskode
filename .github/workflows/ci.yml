name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela: un push nuevo no debe cortar a medias la publicación o el despliegue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/adminsiemprenet/taskode

jobs:
  verify:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_PASSWORD: taskode
          POSTGRES_DB: taskode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Base desechable del runner; las pruebas crean y borran sus propios esquemas.
      TEST_DATABASE_URL: postgresql://postgres:taskode@localhost:5432/taskode_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

  # En PR y dev solo construye. En push a main la publica en GHCR (sha-<commit> y main); Dokploy no compila nada.
  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}:sha-${{ github.sha }}
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main

      # NEXT_PUBLIC_VAPID_PUBLIC_KEY se incrusta en el JavaScript del cliente: es pública y vive como
      # variable del repositorio (Settings → Variables), no como secreto.
      - name: Construir${{ env.PUBLISH == 'true' && ' y publicar' || ' (sin publicar)' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Solo se despliega lo que pasó tipos, pruebas y build de la imagen.
  deploy:
    name: Desplegar en Dokploy
    needs: [verify, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    # Sin esto el workflow reutilizable no recibe ningún secret, ni siquiera los del environment "production".
    secrets: inherit
    with:
      image: ${{ needs.image.outputs.image }}
