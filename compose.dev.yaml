name: brote-dev
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      BROTE_DB_PASSWORD: ${BROTE_DB_PASSWORD:?Configura BROTE_DB_PASSWORD}
      BROTE_CREATE_TEST_DB: "1"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - brote-postgres-dev:/var/lib/postgresql
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-brote.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  brote-postgres-dev:
