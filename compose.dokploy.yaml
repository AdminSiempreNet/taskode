# Producción: PostgreSQL y programador de notificaciones. La web sigue en Vercel.
services:
  notifications:
    image: node:24-alpine
    command: ["node", "/scheduler.mjs"]
    environment:
      NOTIFICATION_PROCESS_URL: ${NOTIFICATION_PROCESS_URL:-https://tareas.siempre.net.co/api/internal/notifications/process}
      NOTIFICATION_WORKER_SECRET: ${NOTIFICATION_WORKER_SECRET:?Configura NOTIFICATION_WORKER_SECRET}
    configs:
      - source: notification-scheduler
        target: /scheduler.mjs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/last-success','utf8'))<180000?0:1)"]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      TASKODE_DB_PASSWORD: ${TASKODE_DB_PASSWORD:?Configura TASKODE_DB_PASSWORD}
      TASKODE_DB_USER: ${TASKODE_DB_USER:-taskode}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - taskode-postgres:/var/lib/postgresql
      - ${POSTGRES_TLS_DIR:?Configura POSTGRES_TLS_DIR}:/etc/postgresql/tls:ro
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/10-taskode.sh
      - source: postgres-hba
        target: /etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  taskode-postgres:
    name: ${TASKODE_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-tareas}_taskode-postgres}
configs:
  notification-scheduler:
    content: |
      import { writeFile } from 'node:fs/promises';
      const endpoint = new URL(process.env.NOTIFICATION_PROCESS_URL);
      if (endpoint.protocol !== 'https:' || endpoint.username || endpoint.password) throw Error('Se requiere un endpoint HTTPS.');
      if ((process.env.NOTIFICATION_WORKER_SECRET || '').length < 32) throw Error('Se requiere un secreto de al menos 32 caracteres.');
      let cursor = null;
      for (;;) {
        const started = Date.now();
        try {
          const url = new URL(endpoint);
          if (cursor) url.searchParams.set('after', cursor);
          const response = await fetch(url, { method: 'POST', redirect: 'error', headers: { Authorization: 'Bearer ' + process.env.NOTIFICATION_WORKER_SECRET }, signal: AbortSignal.timeout(55000) });
          if (!response.ok) throw Error('HTTP ' + response.status);
          const result = await response.json();
          cursor = result.nextCursor;
          console.log(JSON.stringify({ at: new Date().toISOString(), ...result }));
          await writeFile('/tmp/last-success', String(Date.now()));
        } catch { console.warn('No se pudo procesar notificaciones; se reintentará en el siguiente ciclo.'); }
        await new Promise(resolve => setTimeout(resolve, Math.max(1000, 60000 - (Date.now() - started))));
      }
  postgres-init:
    content: |
      #!/bin/sh
      set -eu
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        --set=app_user="$${TASKODE_DB_USER:-taskode}" --set=app_password="$$TASKODE_DB_PASSWORD" --set=app_db="$$POSTGRES_DB" <<'SQL'
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
      SELECT format('GRANT CONNECT, CREATE ON DATABASE %I TO %I', :'app_db', :'app_user') \gexec
      SELECT format('GRANT USAGE, CREATE ON SCHEMA public TO %I', :'app_user') \gexec
      CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;
      SQL
  postgres-hba:
    content: |
      local all all trust
      hostssl all all 0.0.0.0/0 scram-sha-256
      hostssl all all ::/0 scram-sha-256
      hostnossl all all 0.0.0.0/0 reject
      hostnossl all all ::/0 reject
