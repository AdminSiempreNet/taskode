services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      BROTE_DB_PASSWORD: ${BROTE_DB_PASSWORD:?Required}
    volumes:
      - brote-postgres:/var/lib/postgresql
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-brote.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://brote:${BROTE_DB_PASSWORD:?Required}@postgres:5432/${POSTGRES_DB:-brote}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  brote:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "5010:5010"
    environment:
      DATABASE_URL: postgresql://brote:${BROTE_DB_PASSWORD:?Required}@postgres:5432/${POSTGRES_DB:-brote}
      BACKUP_DIR: /app/backups
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - brote-backups:/app/backups
    restart: unless-stopped
volumes:
  brote-postgres:
  brote-backups:
