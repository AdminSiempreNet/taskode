services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      TASKODE_DB_PASSWORD: ${TASKODE_DB_PASSWORD:?Required}
      TASKODE_DB_USER: ${TASKODE_DB_USER:-taskode}
    volumes:
      - taskode-postgres:/var/lib/postgresql
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-taskode.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${TASKODE_DB_USER:-taskode}:${TASKODE_DB_PASSWORD:?Required}@postgres:5432/${POSTGRES_DB:-taskode}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  taskode:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "5010:5010"
    environment:
      DATABASE_URL: postgresql://${TASKODE_DB_USER:-taskode}:${TASKODE_DB_PASSWORD:?Required}@postgres:5432/${POSTGRES_DB:-taskode}
      BACKUP_DIR: /app/backups
      ATTACHMENT_DIR: /app/attachments
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      ABLY_API_KEY: ${ABLY_API_KEY:-}
      ABLY_CHANNEL_NAMESPACE: ${ABLY_CHANNEL_NAMESPACE:-taskode-development}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # The MCP endpoint verifies tokens against its own JWKS without leaving the container.
      MCP_JWKS_URL: ${MCP_JWKS_URL:-http://127.0.0.1:5010/api/auth/jwks}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - taskode-backups:/app/backups
      - taskode-attachments:/app/attachments
    restart: unless-stopped
volumes:
  taskode-postgres:
    name: ${TASKODE_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-tareas}_taskode-postgres}
  taskode-backups:
    name: ${TASKODE_BACKUP_VOLUME:-${COMPOSE_PROJECT_NAME:-tareas}_taskode-backups}
  taskode-attachments:
    name: ${TASKODE_ATTACHMENT_VOLUME:-${COMPOSE_PROJECT_NAME:-tareas}_taskode-attachments}
